html[data-theme="light"]{

*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;

.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 48px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--cyan-soft);box-shadow:var(--glow);color:var(--cyan);font-weight:700}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:10px;padding:8px 14px;cursor:pointer}
select.btn option{background:var(--panel-solid);color:var(--ink)}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.pill{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel)}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:-4px 0 14px;font-size:12.5px;color:var(--muted)}
.meta .stale{color:var(--amber);font-weight:600}
.demo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:2px 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font-size:12.5px;line-height:1.35;padding:7px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);display:flex;gap:8px;align-items:flex-start}
.chip i{font-style:normal;font-weight:700}
.chip.ok{border-color:color-mix(in srgb,var(--green) 45%,transparent)}.chip.ok i{color:var(--green)}
.chip.warn{border-color:color-mix(in srgb,var(--amber) 45%,transparent)}.chip.warn i{color:var(--amber)}
.chip.bad{border-color:color-mix(in srgb,var(--red) 45%,transparent)}.chip.bad i{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--cyan);border-color:transparent;box-shadow:var(--glow);background:var(--cyan-soft)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;backdrop-filter:blur(10px);min-width:0}
.ptitle{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 14px;display:flex;justify-content:space-between;gap:8px 14px;flex-wrap:wrap}
.ptitle .legend{text-transform:none;letter-spacing:0}
.donuts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.dcard{text-align:center;padding:20px 14px 18px}
.dcard h3{margin:0 0 10px;font-size:15px;font-weight:600}
.dcard svg{width:100%;max-width:200px;height:auto;display:block;margin:0 auto}
.dval{font-family:var(--mono);font-weight:700;fill:var(--ink)}
.dlab{fill:var(--muted);font-size:11px}
.dfoot{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.55}
.dfoot b{color:var(--ink);font-family:var(--mono);font-weight:600}
html[data-theme="light"] .rg{filter:none!important}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-top:8px}
.ok{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.warn{color:var(--amber);background:color-mix(in srgb,var(--amber) 14%,transparent)}
.bad{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.chip.ok,.chip.warn,.chip.bad{background:var(--panel);color:var(--ink)}
.fc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.fcard{padding:16px 18px}
.fcard .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.fcard .big{font-family:var(--mono);font-size:24px;font-weight:700;margin:8px 0 4px;white-space:nowrap}
.fcard .s{font-size:12.5px;color:var(--muted);line-height:1.5}
.fcard .s b{color:var(--ink);font-family:var(--mono);font-weight:600}
.fcard .note{font-size:11.5px;color:var(--amber);margin-top:6px;line-height:1.4}
.up{color:var(--green)}.dn{color:var(--red)}.dim{color:var(--dim)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.kpi .v{font-family:var(--mono);font-size:19px;font-weight:700;margin-top:6px;white-space:nowrap}
.kpi .n{font-size:11px;color:var(--dim);margin-top:2px}
.row{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cb{padding:10px 10px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;margin:0 -10px 4px}
.cb:hover,.cb.on{border-color:var(--line-2);background:var(--cyan-soft)}
.cbh{display:flex;align-items:center;gap:8px;font-size:13px}
.cbh .dot{width:10px;height:10px;border-radius:3px}
.cbh b{letter-spacing:.05em;font-size:12.5px}
.cbh .v{margin-inline-start:auto;font-family:var(--mono);font-weight:700;font-size:15px}
.prog{position:relative;height:10px;border-radius:6px;background:var(--track);margin:8px 0 6px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.prog u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink);text-decoration:none}
.cbf{font-size:12px;color:var(--muted);line-height:1.5}
.cbf b{color:var(--ink);font-family:var(--mono);font-weight:600}
.mixbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 0 8px}
.mixbar i{display:block;height:100%;min-width:3px}
.mixleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.mixleg b{color:var(--ink);font-family:var(--mono);font-weight:600}
.mixleg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:14px 0 2px}
.tscroll{overflow-x:auto;margin:0 -6px;padding:0 6px}

tr.tot td{font-weight:700;color:var(--cyan)}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
.bar{height:6px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.lrow{margin-bottom:11px}
.lh{display:flex;justify-content:space-between;gap:10px;font-size:13px;align-items:baseline}

.lh .r b{color:var(--ink);font-weight:600}
.linkbtn{font:inherit;font-size:12.5px;color:var(--cyan);background:none;border:0;padding:4px 0;cursor:pointer}
.adj{font-size:12px;color:var(--muted);border-top:1px dashed var(--line-2);padding-top:10px;margin-top:6px;line-height:1.5}
.adj b{font-family:var(--mono);color:var(--ink);font-weight:600}
svg text{font-family:var(--font)}
#chart svg,#wk svg{width:100%;height:auto;display:block}
.hit{fill:transparent}
.hit:hover,.hit:focus{fill:rgba(148,163,184,.1);outline:none}
.legend{display:flex;gap:6px 14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;background:var(--c)}
.tip{position:fixed;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);display:none;z-index:9;font-family:var(--mono);white-space:pre-line;line-height:1.45;max-width:260px}
footer{color:var(--dim);font-size:12px;margin-top:22px;text-align:center;line-height:1.6}
.msg{font-size:12.5px;color:var(--amber);margin-bottom:8px}
.msg:empty{display:none}
@media (max-width:1100px){.fc{grid-template-columns:repeat(2,1fr)}}
@media (max-width:980px){.donuts{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
@media (max-width:560px){
 .wrap{padding:16px 12px 40px}
 h1{font-size:19px}
 .panel{padding:16px 14px;border-radius:16px}
 .donuts{gap:10px}.dcard{padding:14px 8px 14px}.dcard h3{font-size:13.5px}.dcard svg{max-width:150px}.dfoot{font-size:11.5px}
 .fc{grid-template-columns:1fr;gap:10px}.fcard .big{font-size:22px}
 .kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi .v{font-size:17px}.kpi:last-child:nth-child(odd){grid-column:1/-1}
 .actions{width:100%}.actions .btn,.actions select{flex:1}
 .tab{padding:8px 12px}
}
@media print{.actions,.tabs{display:none}body{background:#fff}}
</style>
</head>

const money=v=>"$ "+nf0.format(v);
const short=v=>{const a=Math.abs(v);if(a>=1e6){const m=a/1e6;return "$ "+(v<0?"-":"")+(m>=100?nf0.format(m):nf1.format(m))+" M"}return money(v)};
const pct=v=>(v*100).toFixed(1).replace(".",",")+"%";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const listOf=k=>GROUPS[k]||[k];
const dl=(c,p)=>{if(p==null||!p)return '<span class="dim">–</span>';const d=c/p-1;return `<span class="${d>=0?"up":"dn"}">${d>=0?"▲":"▼"} ${(Math.abs(d)*100).toFixed(1).replace(".",",")}%</span>`};

/* ---------- Calendario y contexto del mes ---------- */
function chanCal(M,c,elapsed){
 const n=M.days,x=M.canales[c],dow=d=>new Date(M.year,M.month-1,d).getDay();
 const open=Array(n+1).fill(true);let closedW=Array(7).fill(false);
 if(c==="MAYORISTA"){closedW=[true,false,false,false,false,false,true]}
 else if(x){const cnt=Array(7).fill(0),zero=Array(7).fill(0);
  for(let d=1;d<=Math.min(elapsed,n);d++){const w=dow(d),r=x.diario[d-1]||[0,0];cnt[w]++;if(!r[0]&&!r[1])zero[w]++}
  closedW=cnt.map((k,w)=>k>=2&&zero[w]===k)}
 for(let d=1;d<=n;d++)open[d]=!closedW[dow(d)];
 if(!open.slice(1).some(Boolean)){open.fill(true);closedW=Array(7).fill(false)}
 const cum=[0];for(let d=1;d<=n;d++)cum[d]=cum[d-1]+(open[d]?1:0);
 const tot=cum[n],el=cum[Math.min(elapsed,n)];
 let withSales=0,lastSale=0;
 if(x)x.diario.forEach((r,i)=>{if(i<elapsed&&r[0]>0)withSales++;if(r[0]!==0||r[1]!==0)lastSale=i+1});
 return {open,closedW,cum,tot,el,ratio:elapsed>=n?1:(tot?el/tot:0),withSales,lastSale};
}
function monthCtx(M){
 const n=M.days,now=new Date(),cur=now.getFullYear()*12+now.getMonth(),mm=M.year*12+M.month-1;
 let last=0;
 for(const c of CH){const x=M.canales[c];if(!x)continue;x.diario.forEach((r,i)=>{if(r[0]!==0||r[1]!==0)last=Math.max(last,i+1)})}
 const elapsed=mm<cur?n:mm>cur?0:last;
 const per={};for(const c of CH)per[c]=chanCal(M,c,elapsed);
 return {M,n,last,elapsed,closed:elapsed>=n,per};
}
function expRatio(list,C,d){ // ritmo esperado ponderado por FCT al día d
 let num=0,den=0;for(const c of list){const x=C.M.canales[c];if(!x)continue;const p=C.per[c];den+=x.fct;num+=x.fct*(p.tot?p.cum[d]/p.tot:0)}
 return den?num/den:d/C.n;
}
/* ---------- Agregación ---------- */
function agg(list,C){
 const M=C.M;let venta=0,u=0,tk=0,fct=0,fctU=0,proy=0,proyU=0,need=0,needU=0,avg=0,eNum=0;
 const diario=Array(M.days).fill(0),diarioU=Array(M.days).fill(0),diarioT=Array(M.days).fill(0),lin={},low=[];
 for(const c of list){const x=M.canales[c];if(!x)continue;const p=C.per[c];let cv=0,cu=0;
  fct+=x.fct||0;fctU+=x.fctU||0;
  x.diario.forEach((r,i)=>{cv+=r[0];cu+=r[1];tk+=r[2];diario[i]+=r[0];diarioU[i]+=r[1];diarioT[i]+=r[2]});
  venta+=cv;u+=cu;eNum+=(x.fct||0)*p.ratio;
  proy+=p.ratio>0?cv/p.ratio:cv;proyU+=p.ratio>0?cu/p.ratio:cu;
  const rem=p.tot-p.el;
  if(!C.closed&&rem>0){need+=Math.max(0,(x.fct||0)-cv)/rem;needU+=Math.max(0,(x.fctU||0)-cu)/rem}
  if(p.el>0){avg+=cv/p.el}
  if(!C.closed&&p.el>0&&p.withSales/p.el<.5)low.push(c);
  x.lineas.forEach(l=>{lin[l[0]]=lin[l[0]]||[0,0];lin[l[0]][0]+=l[1];lin[l[0]][1]+=l[2]});}
 const e=fct?eNum/fct:(C.n?C.elapsed/C.n:0);
 return {list,venta,u,tk,fct,fctU,diario,diarioU,diarioT,e,proy,proyU,need,needU,avg,low,
  alc:fct?venta/fct:0,alcU:fctU?u/fctU:0,pAlc:fct?proy/fct:0,
  lineas:Object.entries(lin).map(([k,v])=>[k,v[0],v[1]]).sort((a,b)=>b[1]-a[1])};
}
function keyOf(y,m){while(m<1){m+=12;y--}return `${y}-${String(m).padStart(2,"0")}`}
function through(Mx,list,N){if(!Mx)return null;N=Math.min(N,Mx.days);let v=0,u=0,t=0;
 for(const c of list){const x=Mx.canales[c];if(!x)continue;for(let i=0;i<N;i++){const r=x.diario[i];if(!r)break;v+=r[0];u+=r[1];t+=r[2]}}return {v,u,t}}
function comps(C,list){const M=C.M,N=C.elapsed;if(N<=0)return null;
 return {N,cur:through(M,list,N),pm:through(PAYLOAD.meses[keyOf(M.year,M.month-1)],list,N),py:through(PAYLOAD.meses[keyOf(M.year-1,M.month)],list,N)}}
function status(r,e,closed){
 if(closed)return r>=1?["ok","Cumplió"]:r>=.9?["warn","Casi"]:["bad","No cumplió"];
 return r>=e?["ok","En ritmo"]:r>=e-.1?["warn","Leve atraso"]:["bad","Bajo ritmo"]}
const colorOf=(r,e,closed)=>{const s=status(r,e,closed)[0];return s==="ok"?"var(--green)":s==="warn"?"var(--amber)":"var(--red)"};

/* ---------- Gráficos base ---------- */
function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);
 return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`}
function ring(ratio,color,center,label,size=200,stroke=18,marker=null){
 const c=size/2,r=c-stroke/2-4,L=2*Math.PI*r,f=Math.max(0,Math.min(1,ratio));
 let mk="";if(marker!=null){const a=-Math.PI/2+2*Math.PI*Math.min(1,marker);const x0=c+(r-stroke/2-4)*Math.cos(a),y0=c+(r-stroke/2-4)*Math.sin(a),x1=c+(r+stroke/2+4)*Math.cos(a),y1=c+(r+stroke/2+4)*Math.sin(a);
  mk=`<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round" data-tip="Esperado hoy: ${pct(marker)}"/>`}
 return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)} ${esc(center)}">
 <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
 <circle class="rg" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
  stroke-dasharray="${(L*f).toFixed(2)} ${L.toFixed(2)}" transform="rotate(-90 ${c} ${c})" style="filter:drop-shadow(0 0 3px ${color})"/>
 ${mk}<text x="${c}" y="${c+4}" text-anchor="middle" class="dval" font-size="${size*.15}">${esc(center)}</text>
 <text x="${c}" y="${c+size*.14}" text-anchor="middle" class="dlab" font-size="${size*.062}">${esc(label)}</text></svg>`}
function segRing(segs,center,label,size=200,stroke=18){
 const c=size/2,r=c-stroke/2-4,tot=segs.reduce((s,x)=>s+x.v,0)||1;let a=-Math.PI/2,out="";
 segs.forEach(sg=>{const span=2*Math.PI*sg.v/tot;if(span<=0)return;const gap=segs.length>1?.03:0;
  out+=span>=2*Math.PI-1e-6?`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${sg.c}" stroke-width="${stroke}"/>`:
  `<path d="${arc(c,c,r,a+gap/2,a+span-gap/2)}" fill="none" stroke="${sg.c}" stroke-width="${stroke}" stroke-linecap="butt" data-tip="${esc(sg.n)}: ${nf0.format(sg.v)} U (${pct(sg.v/tot)})"/>`;a+=span});
 return `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>${out}
 <text x="${c}" y="${c+4}" text-anchor="middle" class="dval" font-size="${size*.13}">${esc(center)}</text>
 <text x="${c}" y="${c+size*.14}" text-anchor="middle" class="dlab" font-size="${size*.062}">${esc(label)}</text></svg>`}

 /* Patrón semanal */
 $("wk").innerHTML=wk.svg;
 $("foot").innerHTML=`Fuente: ${esc(DATA.fuente)} · Montos sin IVA<br>Días hábiles: Mayorista de lunes a viernes; el resto según los días de la semana en que el canal no vendió nunca en el mes (ej.: Retiro cerrado los domingos). Esperado = días hábiles transcurridos / hábiles del mes, ponderado por FCT. Proyección = venta actual / esperado.`;
}
function renderAlerts(C){
 if(C.closed||!C.elapsed){$("alerts").innerHTML="";return}
 const out=[],M=C.M;
 for(const c of CH){const x=M.canales[c];if(!x||!x.fct)continue;const a=agg([c],C),p=C.per[c];
  if(a.alc>=1)out.push(["ok","✓",`<b>${c}</b> ya alcanzó el FCT (${pct(a.alc)}).`]);
  else if(a.avg>0&&a.need/a.avg>=2)out.push(["bad","!",`<b>${c}</b> necesita ${short(a.need)} por día hábil: ${nf1.format(a.need/a.avg)}× su ritmo actual.`]);
  else if(a.pAlc<.9)out.push(["warn","!",`<b>${c}</b> proyecta cerrar en ${pct(a.pAlc)} del FCT.`]);
  let gap=0;for(let d=p.lastSale+1;d<=C.elapsed;d++)if(p.open[d])gap++;
  if(a.alc<1&&gap>=(c==="MAYORISTA"?3:2))out.push(["warn","⏱",`<b>${c}</b> sin ventas hace ${gap} días hábiles.`]);
 }
 const order={bad:0,warn:1,ok:2};out.sort((x,y)=>order[x[0]]-order[y[0]]);
 $("alerts").innerHTML=out.slice(0,6).map(o=>`<div class="chip ${o[0]}"><i>${o[1]}</i><span>${o[2]}</span></div>`).join("");
}
function weekStats(a,C){
 const M=C.M,n=M.days,dw=d=>new Date(M.year,M.month-1,d).getDay();let best=null,worst=null,zeros=0;
 for(let d=1;d<=C.elapsed;d++){const v=a.diario[d-1],anyOpen=a.list.some(c=>C.per[c]&&C.per[c].open[d]);
  if(v>0){if(!best||v>best.v)best={v,d,dow:dw(d)};if(!worst||v<worst.v)worst={v,d,dow:dw(d)}}
  else if(anyOpen)zeros++}
 const sum=Array(7).fill(0),cnt=Array(7).fill(0);
 for(let d=1;d<=C.elapsed;d++){const w=dw(d);sum[w]+=a.diario[d-1];cnt[w]++}
 const closedW=Array.from({length:7},(_,w)=>a.list.every(c=>C.per[c]&&C.per[c].closedW[w]));
 const avg=sum.map((s,w)=>cnt[w]?s/cnt[w]:0), idx=[1,2,3,4,5,6,0], mxv=Math.max(...avg,1);
 const W=320,H=170,pl=6,bw=(W-pl*2)/7,top=18,bh=H-top-26;
 const bars=idx.map((w,i)=>{const x=pl+i*bw+bw*.16,h=closedW[w]?0:avg[w]/mxv*bh,y=top+bh-h;
  const tip=closedW[w]?`${DOWL[w]}: cerrado`:`${DOWL[w]}: promedio ${money(avg[w])}\n(${cnt[w]} ${cnt[w]===1?"día":"días"})`;
  return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.68).toFixed(1)}" height="${Math.max(closedW[w]?2:0,h).toFixed(1)}" rx="3" fill="${closedW[w]?"var(--track)":"var(--cyan)"}" opacity="${closedW[w]?1:.85}" data-tip="${esc(tip)}" tabindex="0"/>
  <text x="${(x+bw*.34).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${DOW[w]}</text>
  <text x="${(x+bw*.34).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--ink)">${closedW[w]?"cerr.":cnt[w]?short(avg[w]).replace("$ ",""):""}</text>`}).join("");
 return {best,worst,zeros,svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Venta promedio por día de la semana">${bars}</svg>`};
}
function drawChart(a,C){
 const M=C.M,n=M.days,host=$("chart"),W=Math.max(300,Math.round(host.clientWidth||720)),mob=W<520;
 const H=mob?340:380,p={l:mob?42:54,r:mob?10:14,t:16,b:24},topH=mob?170:210,gap=24,iw=W-p.l-p.r,bw=iw/n;
 const botTop=p.t+topH+gap,botH=H-p.b-botTop,fs=11;
 const x=i=>p.l+(i+.5)*bw;
 let cum=0;const cumA=a.diario.map(v=>cum+=v);const cl=C.elapsed?cumA[C.elapsed-1]:0;
 const showProj=!C.closed&&C.elapsed>0;
 const maxY=Math.max(a.fct,showProj?a.proy:0,cl,1)*1.06,yT=v=>p.t+topH-(v/maxY)*topH;
 const maxB=Math.max(...a.diario,1),yB=v=>botTop+botH-(v/maxB)*botH;
 let g="";for(let i=0;i<=4;i++){const v=maxY*i/4,y=yT(v);g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="${p.l-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="${fs}" fill="var(--dim)">${short(v).replace("$ ","")}</text>`}
 g+=`<text x="${p.l-6}" y="${yB(maxB)+4}" text-anchor="end" font-size="${fs}" fill="var(--dim)">${short(maxB).replace("$ ","")}</text><text x="${p.l-6}" y="${yB(0)+4}" text-anchor="end" font-size="${fs}" fill="var(--dim)">0</text><line x1="${p.l}" x2="${W-p.r}" y1="${yB(0)}" y2="${yB(0)}" stroke="var(--line-2)"/>`;
 g+=`<text x="${p.l}" y="${p.t+topH+gap-8}" font-size="${fs}" fill="var(--dim)">Venta diaria</text>`;
 const fy=yT(a.fct);
 g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${fy.toFixed(1)}" y2="${fy.toFixed(1)}" stroke="var(--amber)" stroke-width="1.2" opacity=".6"/><text x="${p.l+4}" y="${(fy-5).toFixed(1)}" font-size="${fs}" fill="var(--amber)">FCT ${short(a.fct)}</text>`;
 const paceD=Array.from({length:n},(_,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${yT(a.fct*expRatio(a.list,C,i+1)).toFixed(1)}`).join(" ");
 let svg=g+`<path d="${paceD}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="6 5"/>`;
 let bars="";
 a.diario.forEach((v,i)=>{const d=i+1,bx=p.l+i*bw+bw*.18,by=yB(Math.max(0,v)),closedD=a.list.every(c=>C.per[c]&&!C.per[c].open[d]);
  if(closedD&&v<=0)bars+=`<rect x="${bx.toFixed(1)}" y="${(yB(0)-2).toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="2" fill="var(--dim)" opacity=".5"/>`;
  else bars+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(0,yB(0)-by).toFixed(1)}" rx="2" fill="var(--cyan)" opacity="${d<=C.elapsed?.85:.25}"/>`;
  if(d%5===0||d===1||d===n)bars+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="${fs}" fill="var(--dim)">${d}</text>`});
 svg+=bars;
 if(C.elapsed){
  const pts=cumA.slice(0,C.elapsed).map((v,i)=>[x(i),yT(v)]);
  const line=pts.map((q,i)=>`${i?"L":"M"}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(" ");
  svg+=`<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--violet)" stop-opacity=".28"/><stop offset="1" stop-color="var(--violet)" stop-opacity="0"/></linearGradient></defs>
   <path d="${line} L${pts[pts.length-1][0].toFixed(1)} ${yT(0)} L${pts[0][0].toFixed(1)} ${yT(0)} Z" fill="url(#ga)"/>
   <path d="${line}" fill="none" stroke="var(--violet)" stroke-width="2.5" stroke-linejoin="round"/>`;
  if(showProj){const q=pts[pts.length-1],ex=x(n-1),ey=yT(a.proy),anchor=ex>W-90?"end":"start";
   svg+=`<path d="M${q[0].toFixed(1)} ${q[1].toFixed(1)} L${ex.toFixed(1)} ${ey.toFixed(1)}" fill="none" stroke="var(--violet)" stroke-width="2" stroke-dasharray="3 4" opacity=".75"/>
   <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="4.5" fill="var(--violet)"/>
   <text x="${(anchor==="end"?ex-8:ex+8).toFixed(1)}" y="${(ey+(a.proy>a.fct?-8:16)).toFixed(1)}" text-anchor="${anchor}" font-size="${fs}" font-weight="700" fill="var(--violet)" stroke="var(--panel-solid)" stroke-width="4" paint-order="stroke">Proy. ${pct(a.pAlc)}</text>`}
 }
 let hits="";
 for(let i=0;i<n;i++){const d=i+1,w=new Date(M.year,M.month-1,d).getDay(),cv=i<C.elapsed?cumA[i]:null;
  const tip=`${DOW[w]} ${d}/${M.month}\nVenta: ${money(a.diario[i])}\n`+(cv!=null?`Acumulado: ${short(cv)}${a.fct?` (${pct(cv/a.fct)} del FCT)`:""}\n`:"")+`Unidades: ${nf0.format(a.diarioU[i])} · Tickets: ${nf0.format(a.diarioT[i])}`;
  hits+=`<rect class="hit" x="${(p.l+i*bw).toFixed(1)}" y="${p.t}" width="${bw.toFixed(1)}" height="${(H-p.b-p.t).toFixed(1)}" data-tip="${esc(tip)}" tabindex="0" aria-label="${esc(tip.replace(/\n/g,", "))}"/>`}
 host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Venta acumulada y diaria">${svg}${hits}</svg>`;
}
/* ---------- Interacción ---------- */
function selectK(k){sel=k;showAll=false;render()}
document.addEventListener("click",e=>{
 if(e.target.closest("#more")){showAll=!showAll;render();return}
 const t=e.target.closest("[data-k]");if(t)selectK(t.dataset.k)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".cb[data-k]")){e.preventDefault();selectK(e.target.dataset.k)}});
const tip=$("tip");
function showTip(text,x,y){tip.textContent=text;tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight;
 tip.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+"px";tip.style.top=Math.max(8,Math.min(y,innerHeight-h-8))+"px"}
const hideTip=()=>{tip.style.display="none"};
document.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const t=e.target.closest&&e.target.closest("[data-tip]");t?showTip(t.dataset.tip,e.clientX+12,e.clientY+12):hideTip()});
document.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")return;const t=e.target.closest&&e.target.closest("[data-tip]");t?showTip(t.dataset.tip,e.clientX-60,e.clientY-90):hideTip()});
document.addEventListener("focusin",e=>{const t=e.target.closest&&e.target.closest("[data-tip]");if(t){const b=t.getBoundingClientRect();showTip(t.dataset.tip,b.left+b.width/2,Math.max(8,b.top+20))}else hideTip()});
document.addEventListener("focusout",hideTip);
document.addEventListener("scroll",hideTip,{passive:true});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(DATA)drawChart(agg(listOf(sel),monthCtx(DATA)),monthCtx(DATA))},120)});
/* Tema: respeta el del sistema si no hay preferencia guardada */
function setTheme(t,save){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"Tema claro":"Tema oscuro";if(save)try{localStorage.setItem("ventas-theme",t)}catch(e){}}
(function(){let t=null;try{t=localStorage.getItem("ventas-theme")}catch(e){}
 setTheme(t==="light"||t==="dark"?t:(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"),false)})();
$("theme").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true));
/* Modo admin: el botón de subir planilla solo aparece con ?admin=1 (se recuerda en este navegador; ?admin=0 lo oculta) */
const ADMIN=(()=>{let v=null;try{v=new URLSearchParams(location.search).get("admin")}catch(e){}
 try{if(v==="1")localStorage.setItem("ventas-admin","1");if(v==="0")localStorage.removeItem("ventas-admin");return localStorage.getItem("ventas-admin")==="1"}catch(e){return v==="1"}})();
$("upl").hidden=!ADMIN;

/* ---------- Datos guardados en el servidor ---------- */
const fmtFecha=iso=>{try{return new Date(iso).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return iso}};
let SERVER=false;
function usePayload(p,keepMonth){
 PAYLOAD=p;const keys=Object.keys(p.meses).sort();
 if(!keepMonth||!p.meses[MKEY]) MKEY=keys[keys.length-1];
 DATA=p.meses[MKEY];
 $("mes").innerHTML=keys.slice().reverse().map(k=>`<option value="${k}"${k===MKEY?" selected":""}>${esc(p.meses[k].mes)}</option>`).join("");
 if(SERVER){const h=(Date.now()-new Date(p.actualizado))/36e5,old=h>36;
  $("upd").innerHTML=`Planilla: ${esc(p.archivo)} · subida el ${fmtFecha(p.actualizado)}`+(old?` <span class="stale">⚠ hace ${Math.floor(h/24)} días: puede estar desactualizada</span>`:"")}
 else $("upd").innerHTML=`<span class="demo">Datos de ejemplo</span>`+(ADMIN?" Abrí el sitio desde el servidor para guardar planillas.":"");
 render();
}
$("mes").addEventListener("change",e=>{MKEY=e.target.value;DATA=PAYLOAD.meses[MKEY];showAll=false;render()});
async function loadServer(keepMonth){
 try{const r=await fetch("api/data",{cache:"no-store"});
  if(r.ok){SERVER=true;usePayload(await r.json(),keepMonth);return}
  if(r.status===404){SERVER=true;}
 }catch(e){}
 if(!DATA) usePayload(PAYLOAD,false);
}
function getToken(){try{return localStorage.getItem("ventas-token")||""}catch(e){return ""}}
function setToken(v){try{localStorage.setItem("ventas-token",v)}catch(e){}}
async function upload(f,token){
 return fetch("api/upload",{method:"POST",body:f,headers:{"Content-Type":"application/octet-stream","X-Filename":encodeURIComponent(f.name),"X-Upload-Token":token}});
}
$("file").addEventListener("change",async e=>{
 const f=e.target.files[0];e.target.value="";if(!f)return;
 if(!SERVER){$("msg").textContent="Para guardar la planilla, abrí el sitio desde el servidor (Portainer), no como archivo local.";return}
 $("msg").textContent=`Subiendo y procesando ${f.name}… (puede tardar unos segundos)`;
 try{let token=getToken();
  if(!token){const hl=await fetch("api/health",{cache:"no-store"}).then(r=>r.json()).catch(()=>({}));
   if(hl.uploadProtected){token=prompt("Código de carga:")||"";if(!token){$("msg").textContent="Carga cancelada.";return}}}
  let r=await upload(f,token);
  if(r.status===401){token=prompt("Código de carga:")||"";if(!token){$("msg").textContent="Carga cancelada.";return}r=await upload(f,token)}
  const j=await r.json().catch(()=>({error:"Respuesta inválida del servidor."}));
  if(!r.ok){if(r.status===401)setToken("");$("msg").textContent=j.error||("Error "+r.status);return}
  setToken(token);$("msg").textContent="";MKEY=null;usePayload(j,false);
 }catch(err){$("msg").textContent="No se pudo subir: "+err.message}
});
setInterval(()=>{if(SERVER&&!document.hidden)loadServer(true)},5*60*1000);
loadServer(false);
</script>
